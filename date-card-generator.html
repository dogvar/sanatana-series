<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festival Date Cards — Sanatana Series</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Serif+Devanagari:wght@400;700&family=Lora:ital,wght@0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --dark:#0D0400; --gold:#D4A017; --saff:#C94800; --cream:#FFFBF4; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; background:#1A0A00; color:white;
  min-height:100vh; padding:20px 16px; max-width:640px; margin:0 auto; }

h1 { font-family:'Yatra One',cursive; color:var(--gold); font-size:22px; margin-bottom:4px; }
.sub { font-size:13px; color:rgba(255,255,255,0.5); margin-bottom:20px; }

/* Festival picker */
.picker { background:rgba(255,255,255,0.06); border-radius:12px; padding:16px; margin-bottom:16px; }
.picker label { font-size:12px; color:rgba(212,160,23,0.7); letter-spacing:1px;
  text-transform:uppercase; display:block; margin-bottom:6px; }
.picker select, .picker input { width:100%; background:rgba(0,0,0,0.4);
  border:1px solid rgba(212,160,23,0.25); border-radius:8px;
  color:white; font-size:14px; padding:10px 12px; margin-bottom:10px;
  font-family:'DM Sans',sans-serif; appearance:none; }
.picker select:focus, .picker input:focus {
  outline:none; border-color:rgba(212,160,23,0.6); }
.generate-btn { width:100%; background:var(--saff); color:white;
  border:none; border-radius:10px; padding:13px; font-size:15px;
  font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif;
  transition:background 0.15s; }
.generate-btn:hover { background:#E85D00; }

/* Canvas preview */
.preview-wrap { background:rgba(255,255,255,0.04); border-radius:12px;
  padding:16px; margin-bottom:16px; text-align:center; }
.preview-label { font-size:12px; color:rgba(255,255,255,0.4); margin-bottom:10px; }
canvas { border-radius:12px; max-width:100%; display:block; margin:0 auto; }

/* Download / share buttons */
.action-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.action-btn { padding:12px; border-radius:10px; font-size:14px; font-weight:600;
  cursor:pointer; border:none; font-family:'DM Sans',sans-serif;
  display:flex; align-items:center; justify-content:center; gap:6px; }
.dl-btn { background:var(--gold); color:var(--dark); }
.wa-btn { background:#25D366; color:white; }

/* Festival presets */
.presets { background:rgba(255,255,255,0.04); border-radius:12px; padding:14px; }
.preset-label { font-size:12px; color:rgba(212,160,23,0.6); letter-spacing:1px;
  text-transform:uppercase; margin-bottom:10px; }
.preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.preset-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:8px; padding:9px 10px; font-size:12px; color:rgba(255,255,255,0.75);
  cursor:pointer; text-align:left; font-family:'DM Sans',sans-serif;
  transition:background 0.15s; display:flex; flex-direction:column; gap:2px; }
.preset-btn:hover { background:rgba(255,255,255,0.1); }
.preset-btn .pf-name { font-weight:600; font-size:13px; }
.preset-btn .pf-date { color:rgba(212,160,23,0.6); font-size:11px; }
</style>
</head>
<body>

<h1>Festival Date Cards</h1>
<p class="sub">Create WhatsApp-shareable cards for any Hindu festival · Sanatana Series</p>

<!-- PICKER -->
<div class="picker">
  <label>Festival Name</label>
  <input type="text" id="festName" placeholder="e.g. Hanuman Jayanti" value="Hanuman Jayanti">

  <label>Date</label>
  <input type="text" id="festDate" placeholder="e.g. Thursday, 2 April 2026" value="Thursday, 2 April 2026">

  <label>Subtitle / What to do</label>
  <input type="text" id="festSub" placeholder="e.g. Recite Hanuman Chalisa · Visit temple at sunrise"
    value="Recite Hanuman Chalisa · Visit temple at sunrise">

  <label>Devanagari name (optional)</label>
  <input type="text" id="festDeva" placeholder="e.g. हनुमान जयन्ती" value="हनुमान जयन्ती">

  <label>Colour theme</label>
  <select id="festColor">
    <option value="#C94800">Saffron — Hanuman / Ram</option>
    <option value="#880035">Deep Red — Navratri / Durga</option>
    <option value="#003366">Navy — Bhagavad Gita / Krishna</option>
    <option value="#006D6D">Teal — Jainism / Mahavir</option>
    <option value="#2E7D32">Forest Green — Nature / Harvest</option>
    <option value="#4A0060">Purple — Shiva / Pradosh</option>
    <option value="#B8860B">Gold — Purnima / Diwali / Lakshmi</option>
    <option value="#8B4500">Brown — Ramayana / Vrat</option>
  </select>

  <button class="generate-btn" onclick="generateCard()">✨ Generate Card</button>
</div>

<!-- PREVIEW -->
<div class="preview-wrap">
  <div class="preview-label">Preview (1080 × 1080px — square for WhatsApp)</div>
  <canvas id="cardCanvas" width="1080" height="1080"></canvas>
</div>

<!-- ACTIONS -->
<div class="action-row">
  <button class="action-btn dl-btn" onclick="downloadCard()">
    ⬇️ Download PNG
  </button>
  <button class="action-btn wa-btn" onclick="shareWhatsApp()">
    💬 Share Link
  </button>
</div>

<!-- PRESETS -->
<div class="presets">
  <div class="preset-label">Quick presets — 2026</div>
  <div class="preset-grid">
    <button class="preset-btn" onclick="loadPreset('Hanuman Jayanti','Thursday, 2 April 2026','Recite Hanuman Chalisa · Visit temple at sunrise','हनुमान जयन्ती','#C94800')">
      <span class="pf-name">🏔️ Hanuman Jayanti</span>
      <span class="pf-date">2 April 2026</span>
    </button>
    <button class="preset-btn" onclick="loadPreset('Akshaya Tritiya','Sunday, 19 April 2026','Most auspicious day · New beginnings · Gold & charity','अक्षय तृतीया','#B8860B')">
      <span class="pf-name">✨ Akshaya Tritiya</span>
      <span class="pf-date">19 April 2026</span>
    </button>
    <button class="preset-btn" onclick="loadPreset('Buddha Purnima','Friday, 1 May 2026','Meditation · Dana (giving) · Temple visit','बुद्ध पूर्णिमा','#006D6D')">
      <span class="pf-name">☸️ Buddha Purnima</span>
      <span class="pf-date">1 May 2026</span>
    </button>
    <button class="preset-btn" onclick="loadPreset('Nirjala Ekadashi','Thursday, 25 June 2026','Waterless fast · Merit of all 24 Ekadashis','निर्जला एकादशी','#003366')">
      <span class="pf-name">💧 Nirjala Ekadashi</span>
      <span class="pf-date">25 June 2026</span>
    </button>
    <button class="preset-btn" onclick="loadPreset('Guru Purnima','Wednesday, 29 July 2026','Honour your Guru · Initiation · Spiritual learning','गुरु पूर्णिमा','#B8860B')">
      <span class="pf-name">🙏 Guru Purnima</span>
      <span class="pf-date">29 July 2026</span>
    </button>
    <button class="preset-btn" onclick="loadPreset('Raksha Bandhan','Friday, 28 August 2026','Sisters tie rakhi · Brother-sister bond','रक्षा बंधन','#880035')">
      <span class="pf-name">🪢 Raksha Bandhan</span>
      <span class="pf-date">28 August 2026</span>
    </button>
    <button class="preset-btn" onclick="loadPreset('Ganesh Chaturthi','Monday, 14 September 2026','Birth of Lord Ganesha · 10-day celebration begins','गणेश चतुर्थी','#CC6600')">
      <span class="pf-name">🐘 Ganesh Chaturthi</span>
      <span class="pf-date">14 September 2026</span>
    </button>
    <button class="preset-btn" onclick="loadPreset('Diwali','Sunday, 8 November 2026','Festival of lights · Lakshmi Puja · Deepotsav','दीपावली','#B8860B')">
      <span class="pf-name">🪔 Diwali</span>
      <span class="pf-date">8 November 2026</span>
    </button>
  </div>
</div>

<script>
// ── Load Google Font into canvas ──
// We pre-render text with system fallback since canvas can't load web fonts
// without explicit font-face loading trick

async function loadCanvasFonts() {
  if (document.fonts) {
    await document.fonts.load('bold 60px "Yatra One"');
    await document.fonts.load('400 44px "Noto Serif Devanagari"');
    await document.fonts.load('italic 32px "Lora"');
  }
}

function loadPreset(name, date, sub, deva, color) {
  document.getElementById('festName').value  = name;
  document.getElementById('festDate').value  = date;
  document.getElementById('festSub').value   = sub;
  document.getElementById('festDeva').value  = deva;
  document.getElementById('festColor').value = color;
  generateCard();
}

function hexToRgb(hex, alpha) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return alpha !== undefined
    ? 'rgba('+r+','+g+','+b+','+alpha+')'
    : 'rgb('+r+','+g+','+b+')';
}

function darken(hex, factor) {
  var r = Math.floor(parseInt(hex.slice(1,3),16) * factor);
  var g = Math.floor(parseInt(hex.slice(3,5),16) * factor);
  var b = Math.floor(parseInt(hex.slice(5,7),16) * factor);
  return 'rgb('+r+','+g+','+b+')';
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  var words = text.split(' ');
  var line  = '';
  var lines = [];
  for (var i = 0; i < words.length; i++) {
    var test = line + (line ? ' ' : '') + words[i];
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  lines.push(line);
  lines.forEach(function(l, idx) {
    ctx.fillText(l, x, y + idx * lineH);
  });
  return lines.length;
}

async function generateCard() {
  await loadCanvasFonts();

  var name   = document.getElementById('festName').value  || 'Festival';
  var date   = document.getElementById('festDate').value  || '';
  var sub    = document.getElementById('festSub').value   || '';
  var deva   = document.getElementById('festDeva').value  || '';
  var accent = document.getElementById('festColor').value || '#C94800';

  var canvas = document.getElementById('cardCanvas');
  var ctx    = canvas.getContext('2d');
  var W = 1080, H = 1080;

  // ── Background ──
  var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0D0400');
  bgGrad.addColorStop(0.5, darken(accent, 0.12));
  bgGrad.addColorStop(1, '#050200');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // ── Radial glow ──
  var glow = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, W*0.55);
  glow.addColorStop(0, hexToRgb(accent, 0.14));
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // ── Border ──
  ctx.strokeStyle = hexToRgb(accent, 0.45);
  ctx.lineWidth   = 6;
  ctx.strokeRect(28, 28, W-56, H-56);
  ctx.strokeStyle = 'rgba(212,160,23,0.2)';
  ctx.lineWidth   = 2;
  ctx.strokeRect(44, 44, W-88, H-88);

  // ── Corner diamonds ──
  function diamond(cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy-s); ctx.lineTo(cx+s, cy);
    ctx.lineTo(cx, cy+s); ctx.lineTo(cx-s, cy);
    ctx.closePath();
    ctx.fillStyle = accent;
    ctx.fill();
  }
  [28,W-28].forEach(function(x) { [28,H-28].forEach(function(y) { diamond(x,y,10); }); });
  [W/2].forEach(function(x) { [28,H-28].forEach(function(y) { diamond(x,y,7); }); });

  // ── OM symbol (large, faded) ──
  ctx.font = 'bold 280px "Noto Serif Devanagari", serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = hexToRgb(accent, 0.06);
  ctx.fillText('ॐ', W/2, H*0.55);

  // ── Eyebrow ──
  ctx.font = '500 26px "DM Sans", sans-serif';
  ctx.fillStyle = hexToRgb(accent, 0.65);
  ctx.letterSpacing = '4px';
  ctx.fillText('✦  SANATANA SERIES  ✦', W/2, 110);

  // ── Devanagari ──
  if (deva) {
    ctx.font = '400 62px "Noto Serif Devanagari", serif';
    ctx.fillStyle = hexToRgb(accent, 0.55);
    ctx.fillText(deva, W/2, 200);
  }

  // ── Festival name ──
  ctx.font = 'bold 88px "Yatra One", cursive';
  ctx.fillStyle = accent === '#B8860B' ? '#D4A017' : accent;
  // Slightly lighten accent for readability
  var nameLines = name.split(' ');
  if (nameLines.length > 2 || ctx.measureText(name).width > 900) {
    // Two lines
    ctx.fillText(nameLines.slice(0, Math.ceil(nameLines.length/2)).join(' '), W/2, deva ? 310 : 280);
    ctx.fillText(nameLines.slice(Math.ceil(nameLines.length/2)).join(' '), W/2, deva ? 410 : 380);
  } else {
    ctx.font = 'bold 96px "Yatra One", cursive';
    ctx.fillText(name, W/2, deva ? 350 : 310);
  }

  // ── Divider ──
  var divY = deva ? 460 : 420;
  ctx.beginPath();
  ctx.moveTo(W/2 - 120, divY);
  ctx.lineTo(W/2 + 120, divY);
  ctx.strokeStyle = hexToRgb(accent, 0.5);
  ctx.lineWidth = 2;
  ctx.stroke();
  diamond(W/2, divY, 8);

  // ── Date ──
  ctx.font = '600 44px "DM Sans", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.90)';
  ctx.fillText(date, W/2, divY + 70);

  // ── Subtitle ──
  if (sub) {
    ctx.font = 'italic 32px "Lora", serif';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    wrapText(ctx, sub, W/2, divY + 140, 860, 48);
  }

  // ── Bottom attribution ──
  ctx.font = '500 26px "DM Sans", sans-serif';
  ctx.fillStyle = hexToRgb(accent, 0.5);
  ctx.fillText('dogvar.github.io/sanatana-series', W/2, H - 80);

  ctx.font = '400 22px "DM Sans", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillText('Free · No ads · For every generation', W/2, H - 46);
}

function downloadCard() {
  var canvas = document.getElementById('cardCanvas');
  var name   = document.getElementById('festName').value || 'festival';
  var link   = document.createElement('a');
  link.download = name.toLowerCase().replace(/\s+/g,'-') + '-2026.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function shareWhatsApp() {
  var name = document.getElementById('festName').value || 'Festival';
  var date = document.getElementById('festDate').value || '';
  var url  = 'https://dogvar.github.io/sanatana-series/calendar.html';
  var text = encodeURIComponent(
    '🙏 ' + name + ' — ' + date +
    '\n\nFull guide & calendar: ' + url +
    '\n\nSanatana Series — Free Hindu festival guides'
  );
  window.open('https://wa.me/?text=' + text, '_blank');
}

// Generate on load
window.addEventListener('load', function() {
  setTimeout(generateCard, 600);
});
</script>

</body>
</html>
